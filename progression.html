<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progression • Dojo</title>

    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body class="page-progression">

    <!-- FOND ANIMÉ -->
    <div id="background">
        <div class="smoke"></div>
        <div class="smoke"></div>
        <div class="smoke"></div>
    </div>

    <script>
        for (let i = 0; i < 40; i++) {
            const p = document.createElement("div");
            p.className = "particle";
            p.style.left = Math.random() * 100 + "vw";
            p.style.top = Math.random() * 100 + "vh";
            p.style.animationDelay = Math.random() * 6 + "s";
            document.getElementById("background").appendChild(p);
        }
    </script>

    <header class="dojo-header">
        <div>
            <div class="dojo-title">📈 Progression</div>
            <div class="dojo-subtitle" id="periodLabel">La voie du guerrier</div>
        </div>
        <button class="dojo-settings-btn" onclick="window.location.href='index.html'">⬅️</button>
    </header>

    <div class="progression-container">

        <!-- Sélecteur de période -->
        <div class="period-selector">
            <button class="period-btn" data-period="7">7j</button>
            <button class="period-btn active" data-period="14">14j</button>
            <button class="period-btn" data-period="30">30j</button>
            <button class="period-btn" data-period="all">Tout</button>
        </div>

        <!-- Statistiques résumées -->
        <div class="stats-summary">
            <div class="stat-card">
                <div class="stat-icon">⚖️</div>
                <div class="stat-value" id="statPoids">—</div>
                <div class="stat-label">Évolution</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">😰</div>
                <div class="stat-value" id="statStress">—</div>
                <div class="stat-label">Stress moy.</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">😴</div>
                <div class="stat-value" id="statSommeil">—</div>
                <div class="stat-label">Sommeil moy.</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🔥</div>
                <div class="stat-value" id="statSport">—</div>
                <div class="stat-label">Total sport</div>
            </div>
        </div>

        <!-- Graphique principal -->
        <div class="chart-container">
            <canvas id="progressionChart"></canvas>
        </div>

        <!-- Timeline des jours -->
        <div class="days-section">
            <h3 class="section-subtitle">Timeline</h3>
            <div class="days-strip" id="daysStrip"></div>
        </div>

        <!-- Détails du jour sélectionné -->
        <div class="details-card" id="detailsCard">
            <div style="text-align: center; padding: 40px; color: #666;">
                <div style="font-size: 48px; margin-bottom: 10px;">📊</div>
                <p>Sélectionne un jour dans la timeline</p>
            </div>
        </div>

    </div>

    <!-- MENU FLOTTANT -->
    <div class="bottom-menu-wrapper">
        <div class="bottom-menu-pill">
            <a href="index.html"><span class="icon">🏯</span>Dojo</a>
            <a href="progression.html" class="active"><span class="icon">📈</span>Progression</a>
            <a href="finance.html"><span class="icon">💸</span>Finances</a>
        </div>
    </div>

<script>
// --- FONCTIONS UTILITAIRES ---
function getJSON(key, def) {
    try {
        const data = localStorage.getItem(key);
        return data ? JSON.parse(data) : def;
    } catch {
        return def;
    }
}

// --- RÉCUPÉRATION DES DONNÉES ---
let historique = getJSON("historiquePoids", []);

// Enrichissement des données avec les infos manquantes
const corpsData = getJSON("corps", {});
const seancesData = getJSON("seances", {});

historique = historique.map((entry, index) => {
    const dateKey = entry.date;
    
    return {
        jour: index + 1,
        date: entry.date,
        poids: entry.poids ? parseFloat(entry.poids) : null,
        stress: entry.stress !== undefined ? parseInt(entry.stress) : (corpsData[dateKey]?.stress ? parseInt(corpsData[dateKey].stress) : null),
        sommeil: entry.sommeil !== undefined ? parseInt(entry.sommeil) : (corpsData[dateKey]?.sommeil ? parseInt(corpsData[dateKey].sommeil) : null),
        sport: entry.sport !== undefined ? parseInt(entry.sport) : (seancesData[dateKey]?.duree ? parseInt(seancesData[dateKey].duree) : null)
    };
});

// Trier par date
historique.sort((a, b) => new Date(a.date) - new Date(b.date));

if (historique.length === 0) {
    document.querySelector(".progression-container").innerHTML = 
        '<div style="text-align:center; padding:60px 20px; color:#aaa;"><div style="font-size:64px; margin-bottom:20px;">📊</div><h2 style="color:#d4af37; margin-bottom:10px;">Pas encore de données</h2><p style="margin-bottom:30px;">Commence ton parcours en validant ton premier rituel !</p><a href="rituel.html" style="display:inline-block; background:#d4af37; color:#000; padding:14px 28px; border-radius:999px; text-decoration:none; font-weight:600;">→ Commencer le rituel</a></div>';
}

// --- VARIABLES GLOBALES ---
let chart = null;
let currentPeriod = 14; // Par défaut 14 jours

// --- FILTRAGE PAR PÉRIODE ---
function filterByPeriod(days) {
    if (days === 'all') return historique;
    return historique.slice(-days);
}

// --- CALCUL DES STATS ---
function calculateStats(data) {
    if (data.length === 0) return;

    // Poids
    const poidsData = data.filter(e => e.poids !== null).map(e => e.poids);
    if (poidsData.length >= 2) {
        const evolution = poidsData[poidsData.length - 1] - poidsData[0];
        const statPoids = document.getElementById("statPoids");
        statPoids.textContent = (evolution > 0 ? "+" : "") + evolution.toFixed(1) + " kg";
        statPoids.style.color = evolution < 0 ? "#4caf50" : (evolution > 0 ? "#ff6b6b" : "#d4af37");
    } else if (poidsData.length === 1) {
        document.getElementById("statPoids").textContent = poidsData[0].toFixed(1) + " kg";
    } else {
        document.getElementById("statPoids").textContent = "—";
    }

    // Stress moyen
    const stressData = data.filter(e => e.stress !== null).map(e => e.stress);
    if (stressData.length > 0) {
        const avgStress = (stressData.reduce((a, b) => a + b, 0) / stressData.length).toFixed(1);
        document.getElementById("statStress").textContent = avgStress + "/10";
    } else {
        document.getElementById("statStress").textContent = "—";
    }

    // Sommeil moyen
    const sommeilData = data.filter(e => e.sommeil !== null).map(e => e.sommeil);
    if (sommeilData.length > 0) {
        const avgSommeil = (sommeilData.reduce((a, b) => a + b, 0) / sommeilData.length).toFixed(1);
        document.getElementById("statSommeil").textContent = avgSommeil + "/10";
    } else {
        document.getElementById("statSommeil").textContent = "—";
    }

    // Sport total
    const sportData = data.filter(e => e.sport !== null).map(e => e.sport);
    if (sportData.length > 0) {
        const totalSport = sportData.reduce((a, b) => a + b, 0);
        document.getElementById("statSport").textContent = totalSport + " min";
    } else {
        document.getElementById("statSport").textContent = "—";
    }
}

// --- CRÉATION DU GRAPHIQUE ---
function createChart(data) {
    const labels = data.map(e => {
        const d = new Date(e.date);
        return d.getDate() + '/' + (d.getMonth() + 1);
    });

    const poidsData = data.map(e => e.poids);
    const stressData = data.map(e => e.stress);
    const sommeilData = data.map(e => e.sommeil);
    const sportData = data.map(e => e.sport);

    const ctx = document.getElementById('progressionChart');

    if (chart) {
        chart.destroy();
    }

    chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [
                {
                    label: "Poids",
                    data: poidsData,
                    borderColor: "#d4af37",
                    backgroundColor: "rgba(212,175,55,0.15)",
                    borderWidth: 3,
                    tension: 0.4,
                    pointRadius: 6,
                    pointBackgroundColor: "#d4af37",
                    pointBorderColor: "#000",
                    pointBorderWidth: 2,
                    pointHoverRadius: 8,
                    yAxisID: 'y',
                    fill: true
                },
                {
                    label: "Stress",
                    data: stressData,
                    borderColor: "#ff6b6b",
                    backgroundColor: "rgba(255,107,107,0.08)",
                    borderWidth: 2.5,
                    tension: 0.4,
                    pointRadius: 5,
                    pointBackgroundColor: "#ff6b6b",
                    pointHoverRadius: 7,
                    yAxisID: 'y1'
                },
                {
                    label: "Sommeil",
                    data: sommeilData,
                    borderColor: "#4da3ff",
                    backgroundColor: "rgba(77,163,255,0.08)",
                    borderWidth: 2.5,
                    tension: 0.4,
                    pointRadius: 5,
                    pointBackgroundColor: "#4da3ff",
                    pointHoverRadius: 7,
                    yAxisID: 'y1'
                },
                {
                    label: "Sport",
                    data: sportData,
                    borderColor: "#4cd964",
                    backgroundColor: "rgba(76,217,100,0.08)",
                    borderWidth: 2.5,
                    tension: 0.4,
                    pointRadius: 5,
                    pointBackgroundColor: "#4cd964",
                    pointHoverRadius: 7,
                    yAxisID: 'y2',
                    hidden: true
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: true,
            interaction: {
                mode: 'index',
                intersect: false
            },
            plugins: {
                legend: {
                    labels: {
                        color: "#ddd",
                        font: { size: 14, weight: '600' },
                        padding: 20,
                        usePointStyle: true,
                        pointStyle: 'circle'
                    }
                },
                tooltip: {
                    backgroundColor: 'rgba(0,0,0,0.9)',
                    titleColor: '#d4af37',
                    bodyColor: '#fff',
                    borderColor: '#d4af37',
                    borderWidth: 2,
                    padding: 14,
                    displayColors: true,
                    titleFont: { size: 14, weight: 'bold' },
                    bodyFont: { size: 13 }
                }
            },
            scales: {
                x: {
                    ticks: { 
                        color: "#aaa",
                        font: { size: 12 }
                    },
                    grid: { 
                        color: "rgba(255,255,255,0.03)",
                        drawBorder: false
                    }
                },
                y: {
                    type: 'linear',
                    display: true,
                    position: 'left',
                    title: {
                        display: true,
                        text: 'Poids (kg)',
                        color: '#d4af37',
                        font: { size: 13, weight: 'bold' }
                    },
                    ticks: { 
                        color: "#d4af37",
                        font: { size: 12 }
                    },
                    grid: { 
                        color: "rgba(212,175,55,0.08)",
                        drawBorder: false
                    }
                },
                y1: {
                    type: 'linear',
                    display: true,
                    position: 'right',
                    title: {
                        display: true,
                        text: 'Stress / Sommeil (/10)',
                        color: '#aaa',
                        font: { size: 13, weight: 'bold' }
                    },
                    min: 0,
                    max: 10,
                    ticks: { 
                        color: "#aaa",
                        font: { size: 12 }
                    },
                    grid: {
                        drawOnChartArea: false,
                        drawBorder: false
                    }
                },
                y2: {
                    type: 'linear',
                    display: false,
                    position: 'right'
                }
            }
        }
    });
}

// --- TIMELINE JOURS ---
function renderDays(data) {
    const daysStrip = document.getElementById("daysStrip");
    daysStrip.innerHTML = "";
    
    data.forEach((entry, index) => {
        const pill = document.createElement("div");
        pill.className = "day-pill";
        pill.dataset.index = index;
        
        const d = new Date(entry.date);
        const dayName = ['Dim', 'Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam'][d.getDay()];
        
        pill.innerHTML = `
            <div class="day-name">${dayName}</div>
            <div class="day-number">${d.getDate()}</div>
        `;
        
        pill.addEventListener("click", () => selectDay(index, data));
        daysStrip.appendChild(pill);
    });

    // Sélectionner le dernier jour par défaut
    if (data.length > 0) {
        selectDay(data.length - 1, data);
    }
}

// --- DÉTAILS JOUR ---
function selectDay(index, data) {
    document.querySelectorAll(".day-pill").forEach(p => p.classList.remove("active"));
    const activePill = document.querySelector(`.day-pill[data-index="${index}"]`);
    if (activePill) {
        activePill.classList.add("active");
        activePill.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }

    const e = data[index];
    const d = new Date(e.date);
    
    // Vérifier que la date est valide
    if (isNaN(d.getTime())) {
        console.error("Date invalide:", e.date);
        return;
    }
    
    const dayName = ['Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'][d.getDay()];
    const month = d.getMonth() + 1;
    const year = d.getFullYear();

    document.getElementById("detailsCard").innerHTML = `
        <div class="detail-header">
            <h2>${dayName} ${d.getDate()}/${month}/${year}</h2>
        </div>
        
        <div class="detail-grid">
            <div class="detail-item ${e.poids ? '' : 'empty'}">
                <div class="detail-icon">⚖️</div>
                <div class="detail-content">
                    <div class="detail-label">Poids</div>
                    <div class="detail-value">${e.poids ? e.poids.toFixed(1) + " kg" : "—"}</div>
                </div>
            </div>
            
            <div class="detail-item ${e.stress !== null ? (e.stress >= 7 ? 'high' : (e.stress >= 4 ? 'medium' : 'good')) : 'empty'}">
                <div class="detail-icon">😰</div>
                <div class="detail-content">
                    <div class="detail-label">Stress</div>
                    <div class="detail-value">${e.stress !== null ? e.stress + "/10" : "—"}</div>
                </div>
            </div>
            
            <div class="detail-item ${e.sommeil !== null ? (e.sommeil >= 7 ? 'good' : (e.sommeil < 5 ? 'high' : 'medium')) : 'empty'}">
                <div class="detail-icon">😴</div>
                <div class="detail-content">
                    <div class="detail-label">Sommeil</div>
                    <div class="detail-value">${e.sommeil !== null ? e.sommeil + "/10" : "—"}</div>
                </div>
            </div>
            
            <div class="detail-item ${e.sport ? 'good' : 'empty'}">
                <div class="detail-icon">🔥</div>
                <div class="detail-content">
                    <div class="detail-label">Sport</div>
                    <div class="detail-value">${e.sport ? e.sport + " min" : "—"}</div>
                </div>
            </div>
        </div>
    `;
}

// --- SÉLECTION DE PÉRIODE ---
document.querySelectorAll(".period-btn").forEach(btn => {
    btn.addEventListener("click", () => {
        document.querySelectorAll(".period-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        
        const period = btn.dataset.period;
        currentPeriod = period === 'all' ? 'all' : parseInt(period);
        
        const filteredData = filterByPeriod(currentPeriod);
        createChart(filteredData);
        renderDays(filteredData);
        calculateStats(filteredData);
    });
});

// --- INITIALISATION ---
if (historique.length > 0) {
    const initialData = filterByPeriod(currentPeriod);
    createChart(initialData);
    renderDays(initialData);
    calculateStats(initialData);
}
</script>

</body>
</html>
