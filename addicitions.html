<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Addictions • Dojo</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="page-dojo">

    <!-- FOND ANIMÉ -->
    <div id="background">
        <div class="smoke"></div>
        <div class="smoke"></div>
        <div class="smoke"></div>
    </div>

    <script>
        for (let i = 0; i < 40; i++) {
            const p = document.createElement("div");
            p.className = "particle";
            p.style.left = Math.random() * 100 + "vw";
            p.style.top = Math.random() * 100 + "vh";
            p.style.animationDelay = Math.random() * 6 + "s";
            document.getElementById("background").appendChild(p);
        }
    </script>

    <!-- HEADER -->
    <header class="dojo-header">
        <div>
            <div class="dojo-title">Addictions</div>
            <div class="dojo-subtitle">Clarté • Rigueur • Vérité</div>
        </div>
        <button class="dojo-settings-btn" onclick="window.location.href='index.html'">⬅️</button>
    </header>

    <main class="dojo-main">

        <section class="dojo-section">
            <h2 class="dojo-section-title">Consommation du jour</h2>

            <div class="dojo-card">

                <div class="row">
                    <div>
                        <label>Joints</label>
                        <input type="number" id="joints" min="0" value="0">
                    </div>
                    <div>
                        <label>Cigarettes</label>
                        <input type="number" id="cigarettes" min="0" value="0">
                    </div>
                </div>

                <label>Heure de la première consommation</label>
                <input type="time" id="heurePremiere">

                <label>Déclencheur principal</label>
                <select id="declencheur">
                    <option value="stress">Stress</option>
                    <option value="ennui">Ennui</option>
                    <option value="social">Social</option>
                    <option value="routine">Routine</option>
                    <option value="aucun">Aucun (jour clean)</option>
                </select>

                <label>Craving (0—10)</label>
                <input type="number" id="craving" min="0" max="10" value="0">

            </div>
        </section>

        <button class="primary" id="validerAddictionsBtn">Valider la journée</button>

        <section class="dojo-section">
            <h2 class="dojo-section-title">Résumé</h2>
            <div class="dojo-card small-text" id="resumeAddictions">
                Valide ta journée pour voir le résumé.
            </div>
        </section>

        <div id="addictionsStatus" style="margin-top: 10px; text-align: center; color: #d4af37;"></div>

    </main>

    <!-- MENU -->
    <div class="bottom-menu-wrapper">
        <div class="bottom-menu-pill">
            <a href="index.html"><span class="icon">🏯</span>Accueil</a>
            <a href="progression.html"><span class="icon">📈</span>Progression</a>
            <a href="finance.html"><span class="icon">💸</span>Finances</a>
        </div>
    </div>

    <script src="dojo.js"></script>

    <script>
        function todayKey() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function getJSON(key, def) {
            try {
                const data = localStorage.getItem(key);
                return data ? JSON.parse(data) : def;
            } catch {
                return def;
            }
        }

        function setJSON(key, value) {
            localStorage.setItem(key, JSON.stringify(value));
        }

        const key = todayKey();
        const statusEl = document.getElementById("addictionsStatus");

        // Vérifier si déjà validé
        const xpGained = getJSON("xpGained", {});
        
        if (xpGained[key]?.addictions) {
            statusEl.innerHTML = "✅ Addictions déjà validées aujourd'hui !";
            statusEl.style.color = "#4caf50";
        }

        // Affichage résumé si déjà rempli
        const add = getJSON("addictions", {});
        if (add[key]) {
            const data = add[key];
            
            // Pré-remplir le formulaire
            document.getElementById("joints").value = data.joints || 0;
            document.getElementById("cigarettes").value = data.cigarettes || 0;
            document.getElementById("heurePremiere").value = data.heurePremiere || "";
            document.getElementById("declencheur").value = data.declencheur || "stress";
            document.getElementById("craving").value = data.craving || 0;

            // Afficher le résumé
            const isClean = parseInt(data.joints) === 0 && parseInt(data.cigarettes) === 0;
            
            document.getElementById("resumeAddictions").innerHTML = 
                "<strong>Joints :</strong> " + data.joints + " | " +
                "<strong>Cigarettes :</strong> " + data.cigarettes + "<br>" +
                "<strong>Première :</strong> " + (data.heurePremiere || "N/A") + " | " +
                "<strong>Déclencheur :</strong> " + data.declencheur + "<br>" +
                "<strong>Craving :</strong> " + data.craving + "/10" +
                (isClean ? "<br><br>🎉 <strong>Journée CLEAN ! +15 XP</strong>" : "");
        }

        // Validation
        document.getElementById("validerAddictionsBtn").addEventListener("click", () => {

            const joints = document.getElementById("joints").value || "0";
            const cigarettes = document.getElementById("cigarettes").value || "0";
            const heurePremiere = document.getElementById("heurePremiere").value || "-";
            const declencheur = document.getElementById("declencheur").value;
            const craving = document.getElementById("craving").value || "0";

            const add = getJSON("addictions", {});
            add[key] = { joints, cigarettes, heurePremiere, declencheur, craving };
            setJSON("addictions", add);

            // Vérifier si déjà validé aujourd'hui
            const xpGained = getJSON("xpGained", {});
            
            let xpEarned = 0;
            const isClean = parseInt(joints) === 0 && parseInt(cigarettes) === 0;

            if (!xpGained[key]?.addictions) {
                // XP bonus si journée clean
                if (isClean) {
                    xpEarned = 15;
                    let xp = parseInt(localStorage.getItem("xp") || "0", 10);
                    xp += xpEarned;
                    localStorage.setItem("xp", xp.toString());
                }

                // Marquer comme validé
                if (!xpGained[key]) {
                    xpGained[key] = {};
                }
                xpGained[key].addictions = true;
                setJSON("xpGained", xpGained);

                if (isClean) {
                    alert("🎉 JOURNÉE CLEAN !\n\nAucune consommation aujourd'hui.\nXP gagnés : +15 XP\n\nContinue comme ça, guerrier !");
                } else {
                    alert("📊 Journée enregistrée.\n\nJoints : " + joints + "\nCigarettes : " + cigarettes + 
                          "\n\n💡 Chaque jour compte. Demain peut être ton jour clean.");
                }
            } else {
                alert("📊 Données mises à jour.\n\n⚠️ XP déjà accordés aujourd'hui (pas de double gain)");
            }

            window.location.href = "index.html";
        });
    </script>

</body>
</html>
